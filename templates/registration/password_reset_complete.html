{% extends 'layouts/base_auth.html' %}

{% block auth_content %}

        <i class="bi bi-check-circle-fill text-success display-5 mb-3 d-block"></i>
        <p class="text-muted mb-4 fw-medium small">
            Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión con tus nuevas credenciales.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100 py-3 text-uppercase fw-bold">Iniciar Sesión</a>
    </div>
{% endblock %}
