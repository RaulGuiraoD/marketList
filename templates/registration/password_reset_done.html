{% extends 'layouts/base_auth.html' %}

{% block auth_content %}
    <div class="text-center py-3">
        <i class="bi bi-envelope-check text-success display-5 mb-3 d-block"></i>
        <p class="text-muted mb-4 fw-medium small">
            Hemos enviado las instrucciones para restablecer tu contraseña al correo electrónico introducido. Si no lo recibes en unos minutos, revisa tu carpeta de spam.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary w-100 py-3">ENTENDIDO</a>
    </div>
{% endblock %}
